<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ambi WASM Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            color: #333;
            padding: 0 20px;
        }

        textarea, input {
            width: 100%;
            margin-bottom: 10px;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #output {
            background: #f8f9fa;
            padding: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            margin-top: 10px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
            max-height: 500px;
            overflow-y: auto;
        }

        .controls input {
            flex: 1;
        }

        /* Mode toggle styling */
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .toggle-label {
            font-size: 14px;
            font-weight: 500;
            color: #555;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 48px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #ccc;
            transition: 0.3s;
            border-radius: 26px;
        }

        .toggle-slider::before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: 0.3s;
            border-radius: 50%;
        }

        .toggle-switch input:checked + .toggle-slider {
            background-color: #4caf50;
        }

        .toggle-switch input:checked + .toggle-slider::before {
            transform: translateX(22px);
        }

        .mode-text {
            font-size: 13px;
            color: #888;
            transition: color 0.3s;
        }

        .mode-text.active {
            color: #4caf50;
            font-weight: 600;
        }
    </style>
</head>
<body>
<h1>Ambi Agent WASM</h1>

<div style="margin-bottom: 20px;">
    <button id="initBtn">1. Initialize Session</button>
    <button id="clearBtn" disabled>Clear Memory</button>
</div>

<!-- Mode toggle: Normal ↔ Streaming -->
<div class="toggle-container">
    <span class="toggle-label">Mode:</span>
    <label class="toggle-switch">
        <input type="checkbox" id="modeToggle">
        <span class="toggle-slider"></span>
    </label>
    <span id="modeText" class="mode-text">Normal</span>
</div>

<textarea id="prompt" rows="3" placeholder="Say hello to Ambi..."></textarea>
<button id="sendBtn" disabled>2. Send to Ambi</button>

<h3>Chat History:</h3>
<div id="output">Please initialize the session first...</div>

<script type="module">
    import init, {AmbiSession} from './pkg/ambi_wasm_example.js';

    // Global reference to our stateful Rust instance
    let session = null;

    // DOM element references
    const output = document.getElementById("output");
    const initBtn = document.getElementById("initBtn");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");
    const modeToggle = document.getElementById("modeToggle");
    const modeText = document.getElementById("modeText");

    // Update the mode indicator text when the toggle changes
    modeToggle.addEventListener("change", () => {
        modeText.textContent = modeToggle.checked ? "Streaming" : "Normal";
        modeText.classList.toggle("active", modeToggle.checked);
    });

    async function run() {
        // Initialize the WebAssembly module
        await init();
        console.log("WASM Module loaded successfully!");

        // 1. Initialize the persistent session
        initBtn.onclick = async () => {
            // Note: In production, do not hardcode API keys in frontend code.

            const baseUrl = "http://localhost:11434/v1";
            const modelName = "qwen2.5-7b:latest";
            const apiKey = "sk-aaa"; // Ensure CORS is allowed

            if (!apiKey) {
                alert("API Key is required!");
                return;
            }

            output.innerText = "Initializing persistent agent session...";
            initBtn.disabled = true;

            try {
                // Call the Rust async constructor to create the instance
                session = await AmbiSession.create(baseUrl, modelName, apiKey);
                output.innerText = "Session initialized! I am ready to remember your conversation.";
                sendBtn.disabled = false;
                clearBtn.disabled = false;
            } catch (e) {
                output.innerText = "Initialization error: " + e;
                initBtn.disabled = false;
            }
        };

        // 2. Send dialogue to the Agent (handles both Normal and Streaming modes)
        sendBtn.onclick = async () => {
            if (!session) return;

            const promptBox = document.getElementById("prompt");
            const prompt = promptBox.value;
            if (!prompt.trim()) return;

            // Append the user's prompt to the UI immediately
            output.innerText += `\n\nUser: ${prompt}\nAssistant: `;
            promptBox.value = "";
            sendBtn.disabled = true;

            const isStreaming = modeToggle.checked;

            try {
                if (isStreaming) {
                    // ---- Streaming mode ----
                    // Use a placeholder that will be replaced progressively
                    const placeholderIdx = output.innerText.length;
                    output.innerText += "▌"; // blinking cursor placeholder

                    // This flag tracks whether we've started receiving real content
                    let started = false;

                    await session.chat_stream(
                        prompt,
                        // on_chunk: called for each token from the LLM
                        (chunk) => {
                            // Remove the cursor placeholder on first chunk
                            if (!started) {
                                started = true;
                                output.innerText = output.innerText.slice(0, placeholderIdx);
                            }
                            // Append the chunk to the output in real-time
                            output.innerText += chunk;
                            // Auto-scroll to the bottom
                            output.scrollTop = output.scrollHeight;
                        },
                        // on_done: called when streaming completes
                        (fullText) => {
                            // If no chunks arrived (empty response), remove the cursor
                            if (!started) {
                                output.innerText = output.innerText.slice(0, placeholderIdx);
                                output.innerText += fullText;
                            }
                            sendBtn.disabled = false;
                        },
                    );
                } else {
                    // ---- Normal (non-streaming) mode ----
                    output.innerText += "Thinking...";

                    // Reuse the session instance to invoke the chat pipeline
                    const response = await session.chat(prompt);

                    // Replace the "Thinking..." placeholder with the actual response
                    output.innerText = output.innerText.replace("Thinking...", response);
                    sendBtn.disabled = false;
                }
            } catch (error) {
                output.innerText += "\nError: " + error;
                sendBtn.disabled = false;
            }
        };

        // 3. Clear memory (context eviction)
        clearBtn.onclick = async () => {
            if (!session) return;
            await session.clear_memory();
            output.innerText = "Memory cleared. The Agent has forgotten the past context.";
        };
    }

    // Bootstrap the application
    run();
</script>
</body>
</html>
