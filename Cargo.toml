[package]
name = "ambi"
version = "0.1.1"
edition = "2021"
description = "A flexible, multi-backend, customizable AI agent framework, entirely based on Rust."
license = "Apache-2.0"
repository = "https://github.com/Maskviva/Ambi"
readme = "README.md"
keywords = ["ai", "agent", "llm", "llama", "openai"]
categories = [
    "artificial-intelligence",
    "api-bindings",
    "asynchronous"
]

[lib]
name = "ambi"
path = "src/lib.rs"

[features]
default = ["llama-cpp", "openai-api"]

llama-cpp = ["dep:llama-cpp-2", "dep:llama-cpp-sys-2"]
openai-api = ["dep:async-openai"]

dynamic-link = ["llama-cpp-2/dynamic-link", "llama-cpp-sys-2/dynamic-link"]

cuda = ["llama-cpp", "llama-cpp-2/cuda", "llama-cpp-sys-2/cuda"]
vulkan = ["llama-cpp", "llama-cpp-2/vulkan", "llama-cpp-sys-2/vulkan"]
metal = ["llama-cpp", "llama-cpp-2/metal", "llama-cpp-sys-2/metal"]
rocm = ["llama-cpp", "llama-cpp-2/rocm", "llama-cpp-sys-2/rocm"]

[dependencies]
log = "0.4"
llama-cpp-2 = { version = "0.1.143", optional = true }
llama-cpp-sys-2 = { version = "0.1.142", optional = true }
async-openai = { version = "0.35.0", features = ["full"], optional = true }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
async-trait = "0.1"
num_cpus = "1.0"
anyhow = "1.0"
futures = "0.3"

[dev-dependencies]
simplelog = "0.12"
chrono = "0.4"

[[example]]
name = "chat_local"
required-features = ["llama-cpp"]

[[example]]
name = "chat_cloud"
required-features = ["openai-api"]

[[example]]
name = "custom_tool"
required-features = ["openai-api"]

[[example]]
name = "custom_model_back"