[package]
name = "ambi-node"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ambi = { path = "../../../Ambi" }
napi = { version = "3.8.6", default-features = false, features = ["napi4", "async", "tokio_rt", "serde-json"] }
napi-derive = "3.5.5"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
serde_json = "1.0"