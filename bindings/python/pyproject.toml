[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ambi-python"
version = "0.1.1"
description = "A flexible, multi-backend, customizable AI agent framework, entirely based on Rust."
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
    { name = "Maskviva", email = "maskviva@users.noreply.github.com" },
]
readme = "README.md"
homepage = "https://github.com/Maskviva/Ambi"
repository = "https://github.com/Maskviva/Ambi"
keywords = ["ai", "agent", "llm", "llama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Source = "https://github.com/Maskviva/Ambi"
Changelog = "https://github.com/Maskviva/Ambi/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Maskviva/Ambi/tree/main/docs"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "ambi_python"
