[package]
name = "ambi-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "ambi_python"
crate-type = ["cdylib"]

[dependencies]
ambi = { path = "../../", default-features = false, features = ["openai-api"] }
pyo3 = { version = "=0.20.0", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
futures = "0.3"
serde_json = "1"
async-trait = "0.1"
