[package]
name = "ambi-python"
version = "0.1.0"
edition = "2021"

[lib]
name = "ambi_core"
crate-type = ["cdylib"]

[dependencies]
ambi = { path = "../../../Ambi" }
pyo3 = { version = "=0.20.0", features = ["extension-module"] }
pyo3-asyncio = { version = "0.20.0", features = ["tokio-runtime"] }
tokio = { version = "1", features = ["full"] }