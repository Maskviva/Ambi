[package]
name = "ambi-memory"
version = "0.1.0"
edition = "2021"
description = "Pluggable 3D memory extension for Ambi: KV state, semantic vector recall, and rolling summary."
license = "Apache-2.0"
repository = "https://github.com/Maskviva/Ambi"
readme = "README.md"
keywords = ["ai", "agent", "llm", "memory", "rag"]
categories = ["artificial-intelligence", "data-structures", "algorithms"]

[lib]
path = "src/lib.rs"

[dependencies]
ambi = { path = "../../Ambi", default-features = false }

async-trait = "0.1.89"
thiserror = "2.0.18"
tokio = { version = "1.52.1", features = ["sync"] }
log = "0.4.29"